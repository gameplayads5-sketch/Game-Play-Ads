<script type="module">

import {getDatabase,ref,set,get,update,onValue,runTransaction} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyD2DBF_GTIkQfa6G_3gZLfZ5n0MaUEBQ48",
 authDomain:"gamenest-bd.firebaseapp.com",
 databaseURL:"https://gamenest-bd-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"gamenest-bd",
 storageBucket:"gamenest-bd.firebasestorage.app",
 messagingSenderId:"1020093526765",
 appId:"1:1020093526765:web:525b5f303e0f08d7b692e4",
 measurementId:"G-Z66KWE43M6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const $=id=>document.getElementById(id);
const authBox=$("auth"),gameBox=$("game"),msg=$("msg");
let currentUser=null,currentProfile=null,roomId=null,roomUnsub=null;
const board=$("board"),ctx=board.getContext("2d");
const R=22,SR=28;
const pockets=[{x:38,y:38},{x:762,y:38},{x:38,y:762},{x:762,y:762}];
let state=null,drag=false,ax=400,ay=690;

/* প্রতিটি player-এর নিজের baseline */
function strikerBaseY(uid, st=state){
  const players=st?.players||[];
  return players.indexOf(uid)===1 ? 110 : 690;
}

function resetStrikerForTurn(st=state){
  if(!st||!st.turn)return;
  st.striker=st.striker||{x:400,y:690,vx:0,vy:0};
  st.striker.x=400;
  st.striker.y=strikerBaseY(st.turn,st);
  st.striker.vx=0;
  st.striker.vy=0;
  st.shotActive=false;
  for(const c of (st.coins||[])){if(c.vx===undefined)c.vx=0;if(c.vy===undefined)c.vy=0;}
}

function cleanMobile(v){
 return String(v||"").replace(/\D/g,"");
}
function emailForMobile(m){
 return cleanMobile(m)+"@gamenestbd.app";
}
function setMsg(t){msg.textContent=t}
function gameMsg(t){$("gameMsg").textContent=t}

function initialState(p1){
 const coins=[{id:"q",x:400,y:400,c:"red",in:false}];
 let n=0;
 for(const ring of [{r:52,n:6},{r:102,n:12}]){
   for(let i=0;i<ring.n;i++){
     const a=2*Math.PI*i/ring.n+(ring.r>60?Math.PI/ring.n:0);
     coins.push({id:"c"+(++n),x:400+Math.cos(a)*ring.r,y:400+Math.sin(a)*ring.r,c:n%2?"white":"black",in:false});
   }
 }
 return {
   players:[p1],
   turn:p1,
   striker:{x:400,y:690,vx:0,vy:0},
   coins,
   playerColors:{[p1]:"black"},
   queenPending:false,
   queenOwner:null,
   queenCovered:false,
   turnOwnCoinPocketed:false,
   version:Date.now(),
   winner:null
 };
}

function ensureGameMeta(st){
  if(!st)return;
  st.players=st.players||[];
  st.playerColors=st.playerColors||{};
  if(st.players[0]&&!st.playerColors[st.players[0]])st.playerColors[st.players[0]]="black";
  if(st.players[1]&&!st.playerColors[st.players[1]])st.playerColors[st.players[1]]="white";
  if(st.queenPending===undefined)st.queenPending=false;
  if(st.queenOwner===undefined)st.queenOwner=null;
  if(st.queenCovered===undefined)st.queenCovered=false;
  if(st.turnOwnCoinPocketed===undefined)st.turnOwnCoinPocketed=false;
  if(st.shotActive===undefined)st.shotActive=false;

  // পুরোনো Room-এর গুটিগুলোতে velocity না থাকলে যোগ করি।
  for(const c of (st.coins||[])){
    if(c.vx===undefined)c.vx=0;
    if(c.vy===undefined)c.vy=0;
  }
}

function playerColor(uid,st=state){
  ensureGameMeta(st);
  return st?.playerColors?.[uid]||"black";
}

function returnQueenToCenter(st){
  ensureGameMeta(st);
  const q=(st.coins||[]).find(c=>c.id==="q");
  if(q){
    q.in=false;
    q.x=400;
    q.y=400;
  }
  st.queenPending=false;
  st.queenOwner=null;
  st.queenCovered=false;
}

function draw(){
 ctx.clearRect(0,0,800,800);
 ctx.fillStyle="#552915";ctx.fillRect(0,0,800,800);
 ctx.fillStyle="#8b4b28";ctx.fillRect(10,10,780,780);
 ctx.fillStyle="#e9b978";ctx.fillRect(28,28,744,744);
 ctx.strokeStyle="#351b10";ctx.lineWidth=7;ctx.strokeRect(48,48,704,704);
 ctx.lineWidth=4;ctx.strokeStyle="#6d351d";ctx.strokeRect(90,90,620,620);
 ctx.lineWidth=5;ctx.strokeStyle="#5b2817";
 for(const y of [110,690]){ctx.beginPath();ctx.moveTo(160,y);ctx.lineTo(640,y);ctx.stroke()}
 for(const x of [110,690]){ctx.beginPath();ctx.moveTo(x,160);ctx.lineTo(x,640);ctx.stroke()}
 pockets.forEach(p=>{ctx.beginPath();ctx.fillStyle="#120c09";ctx.arc(p.x,p.y,32,0,Math.PI*2);ctx.fill()});
 ctx.beginPath();ctx.arc(400,400,125,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.strokeStyle="#a33b22";ctx.arc(400,400,50,0,Math.PI*2);ctx.stroke();

 (state?.coins||[]).filter(c=>!c.in).forEach(c=>{
   ctx.beginPath();ctx.shadowColor="#0008";ctx.shadowBlur=7;
   ctx.fillStyle=c.c==="red"?"#df2020":c.c==="black"?"#171717":"#f5ead5";
   ctx.arc(c.x,c.y,R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
   ctx.strokeStyle="#5b3b28";ctx.lineWidth=2;ctx.stroke();
 });
 if(state){
   const s=state.striker;
   ctx.beginPath();ctx.fillStyle="#fff7e8";ctx.arc(s.x,s.y,SR,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle="#b11d1d";ctx.lineWidth=5;ctx.stroke();
   if(drag){
     ctx.beginPath();ctx.setLineDash([9,9]);ctx.strokeStyle="#b11d1d";ctx.lineWidth=3;
     ctx.moveTo(s.x,s.y);ctx.lineTo(ax,ay);ctx.stroke();ctx.setLineDash([]);
   }
 }
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function insidePocket(p){return pockets.some(q=>dist(p,q)<38)}
function pos(e){
 const r=board.getBoundingClientRect();
 return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*800/r.height}
}

board.addEventListener("pointerdown",e=>{
 if(!state||!roomId||state.turn!==currentUser.uid||state.winner)return;
 const p=pos(e);
 if(dist(p,state.striker)<60){drag=true;ax=p.x;ay=p.y;board.setPointerCapture(e.pointerId);draw()}
});
board.addEventListener("pointermove",e=>{if(drag){const p=pos(e);ax=p.x;ay=p.y;draw()}});
board.addEventListener("pointerup",async e=>{
 if(!drag)return;drag=false;
 if(!state||!roomId||state.turn!==currentUser.uid||state.winner)return;
 const p=pos(e),s=state.striker;
 const dx=s.x-p.x,dy=s.y-p.y,len=Math.hypot(dx,dy)||1;
 const power=Math.min(20,Math.max(4,len/8));

 // নতুন shot শুরু হলে আগের turn-এর pocket flag পরিষ্কার।
 state.turnOwnCoinPocketed=false;
 s.vx=dx/len*power;
 s.vy=dy/len*power;
 state.shotActive=true;

 // Striker যেখানে টানা হয়েছে সেখানেই শুরু হবে; কিন্তু shooting line-এর
 // বাইরে গিয়ে শুরু করতে দেওয়া হবে না।
 const baseY=strikerBaseY(currentUser.uid,state);
 s.y=baseY;
 s.x=Math.max(140,Math.min(660,s.x));

 await saveRoomState();
});

let lastPhysicsSave=0;

function keepInsideBoard(o,r){
  if(o.x-r<72){o.x=72+r;o.vx=Math.abs(o.vx)*0.82}
  if(o.x+r>728){o.x=728-r;o.vx=-Math.abs(o.vx)*0.82}
  if(o.y-r<72){o.y=72+r;o.vy=Math.abs(o.vy)*0.82}
  if(o.y+r>728){o.y=728-r;o.vy=-Math.abs(o.vy)*0.82}
}

function resolveElastic(a,b,ra,rb){
  let dx=b.x-a.x,dy=b.y-a.y;
  let d=Math.hypot(dx,dy);
  const minD=ra+rb;
  if(!d||d>=minD)return false;
  const nx=dx/d,ny=dy/d;
  const overlap=minD-d;
  a.x-=nx*overlap/2; a.y-=ny*overlap/2;
  b.x+=nx*overlap/2; b.y+=ny*overlap/2;

  const rvx=b.vx-a.vx,rvy=b.vy-a.vy;
  const rel=rvx*nx+rvy*ny;
  if(rel>=0)return true;

  // সমান mass-এর প্রায় elastic collision।
  const impulse=-rel*0.92;
  a.vx-=impulse*nx; a.vy-=impulse*ny;
  b.vx+=impulse*nx; b.vy+=impulse*ny;
  return true;
}

function pocketCoin(c){
  if(c.in)return;
  c.in=true;c.vx=0;c.vy=0;

  if(c.id==="q"){
    state.queenPending=true;
    state.queenOwner=currentUser.uid;
    state.queenCovered=false;
  }else if(c.c===playerColor(currentUser.uid,state)){
    state.turnOwnCoinPocketed=true;
    if(state.queenPending && state.queenOwner===currentUser.uid){
      state.queenCovered=true;
      state.queenPending=false;
    }
  }
}

function anyPieceMoving(){
  if(Math.abs(state.striker.vx)>0.05||Math.abs(state.striker.vy)>0.05)return true;
  return (state.coins||[]).some(c=>!c.in && (Math.abs(c.vx)>0.05||Math.abs(c.vy)>0.05));
}

function physics(){
 if(state){
   ensureGameMeta(state);
   const isMyTurn=currentUser && state.turn===currentUser.uid;
   const s=state.striker;

   if(isMyTurn && state.shotActive){
     // Striker + coins সবাই নিজেদের velocity দিয়ে চলবে।
     s.x+=s.vx;s.y+=s.vy;
     s.vx*=0.985;s.vy*=0.985;
     keepInsideBoard(s,SR);

     for(const c of (state.coins||[])){
       if(c.in)continue;
       c.x+=c.vx;c.y+=c.vy;
       c.vx*=0.982;c.vy*=0.982;
       keepInsideBoard(c,R);
     }

     // Striker ↔ coin collision
     for(const c of (state.coins||[])){
       if(c.in)continue;
       if(resolveElastic(s,c,SR,R)){
         const sp=Math.hypot(s.vx,s.vy);
         if(sp<0.15){s.vx*=0.2;s.vy*=0.2}
       }
     }

     // Coin ↔ coin collision
     const coins=state.coins||[];
     for(let i=0;i<coins.length;i++){
       const a=coins[i]; if(a.in)continue;
       for(let j=i+1;j<coins.length;j++){
         const b=coins[j]; if(b.in)continue;
         resolveElastic(a,b,R,R);
       }
     }

     // Pocket detection after movement/collision.
     for(const c of (state.coins||[])){
       if(!c.in && insidePocket(c))pocketCoin(c);
     }

     // Striker pocket = foul; striker ফিরে যাবে।
     if(insidePocket(s)){
       s.x=400;s.y=strikerBaseY(currentUser.uid,state);
       s.vx=0;s.vy=0;
     }

     // সব piece থামলে shot শেষ।
     if(!anyPieceMoving()){
       s.vx=0;s.vy=0;
       for(const c of (state.coins||[])){if(!c.in){c.vx=0;c.vy=0}}
       state.shotActive=false;
       finishTurn();
     }else if(Date.now()-lastPhysicsSave>80){
       lastPhysicsSave=Date.now();
       saveRoomState().catch(console.error);
     }
   }
 }
 draw();requestAnimationFrame(physics);
}
requestAnimationFrame(physics);

let finishing=false;
async function finishTurn(){
 if(finishing||!state||!roomId)return;
 finishing=true;

 ensureGameMeta(state);
 const active=state.players||[];
 const oldPlayer=currentUser.uid;

 // Queen নিলে নিজের colour-এর গুটি দিয়ে cover না করলে Queen মাঝখানে ফেরত।
 if(state.queenPending && state.queenOwner===oldPlayer && !state.queenCovered){
   returnQueenToCenter(state);
 }else if(state.queenCovered){
   state.queenPending=false;
   state.queenOwner=null;
   state.queenCovered=false;
   state.turnOwnCoinPocketed=false;
 }

 // Shot শেষ হলে striker পরের player's fixed shooting position-এ যাবে।
 if(active.length>1){
   const i=active.indexOf(oldPlayer);
   if(i>=0)state.turn=active[(i+1)%active.length];
 }
 resetStrikerForTurn(state);
 state.shotActive=false;
 state.turnOwnCoinPocketed=false;

 await saveRoomState();
 finishing=false;
}

async function saveRoomState(){
 if(!roomId||!currentUser)return;
 state.version=Date.now();
 await update(ref(db,"carromRooms/"+roomId),{state});
}

function dbError(e){
  const c=e?.code||"";
  const m=e?.message||"";
  if(c.includes("PERMISSION_DENIED") || m.includes("PERMISSION_DENIED"))
    return "Firebase অনুমতি নেই। Realtime Database Rules চেক করুন।";
  if(m.toLowerCase().includes("network") || m.toLowerCase().includes("offline"))
    return "ইন্টারনেট/Firebase সংযোগ সমস্যা হয়েছে।";
  return "Firebase সমস্যা: "+m;
}

async function watchRoom(id){
  if(roomUnsub)roomUnsub();
  roomId=id;
  $("roomInput").value=id;
  gameMsg("Room সংযোগ হচ্ছে...");
  roomUnsub=onValue(
    ref(db,"carromRooms/"+id),
    snap=>{
      const v=snap.val();
      if(!v){
        $("roomText").textContent="Room ID: "+id;
        gameMsg("Room পাওয়া যায়নি");
        return;
      }
      state=v.state||null;
      ensureGameMeta(state);

      // পুরোনো Room-এ striker ভুল পাশে থাকলে, বর্তমান turn-এর
      // player-এর সঠিক baseline-এ একবার ঠিক করে দেওয়া হবে।
      if(state?.turn===currentUser.uid){
        const expectedY=strikerBaseY(currentUser.uid,state);

        // Firebase-এ পুরোনো shot-এর striker position এলে সেটি গ্রহণ করা হবে না।
        // বর্তমান turn-এর player-এর fixed shooting position-এ ফেরত যাবে।
        if(!state.striker ||
           Math.abs((state.striker.y??expectedY)-expectedY)>2 ||
           Math.abs((state.striker.x??400)-400)>2 ||
           Math.abs(state.striker.vx||0)>0.001 ||
           Math.abs(state.striker.vy||0)>0.001){
          resetStrikerForTurn(state);
          saveRoomState().catch(console.error);
        }
      }

      $("roomText").textContent="Room ID: "+id+" • Players: "+(state?.players?.length||0)+"/2";
      if(state?.winner)gameMsg("Winner: "+state.winner);
      else if(state?.queenPending && state?.queenOwner===currentUser.uid)
        gameMsg("👑 লাল Queen নিয়েছেন — নিজের "+playerColor(currentUser.uid,state)+" গুটি দিয়ে Cover করুন");
      else if(state?.queenPending)
        gameMsg("👑 Queen Cover বাকি — Cover না হলে Queen মাঝখানে ফিরবে");
      else if(state?.turn===currentUser.uid)gameMsg("আপনার টার্ন");
      else gameMsg("অন্য প্লেয়ারের টার্ন");
      draw();
    },
    err=>gameMsg(dbError(err))
  );
}

async function createRoom(){
  if(!currentUser)return gameMsg("আগে লগইন করুন");
  try{
    const id=Math.random().toString(36).slice(2,8).toUpperCase();
    const st=initialState(currentUser.uid);
    const room={host:currentUser.uid,createdAt:Date.now(),state:st};

    await set(ref(db,"carromRooms/"+id),room);

    const check=await get(ref(db,"carromRooms/"+id));
    if(!check.exists())throw new Error("Room Firebase-এ save হয়নি");

    $("roomInput").value=id;
    await watchRoom(id);
    gameMsg("Room তৈরি হয়েছে। এই Room ID অন্য খেলোয়াড়কে দিন: "+id);
  }catch(e){
    console.error(e);
    gameMsg(dbError(e));
  }
}

async function joinRoom(){
  if(!currentUser)return gameMsg("আগে লগইন করুন");
  const id=$("roomInput").value.trim().replace(/\s+/g,"").toUpperCase();
  if(!id)return gameMsg("Room ID দিন");

  try{
    gameMsg("Room খোঁজা হচ্ছে...");
    const roomRef=ref(db,"carromRooms/"+id);
    const snap=await get(roomRef);

    if(!snap.exists())return gameMsg("Room পাওয়া যায়নি: "+id);

    const room=snap.val();
    const st=room.state;
    if(!st)return gameMsg("Room state পাওয়া যায়নি");
    if((st.players||[]).includes(currentUser.uid)){
      await watchRoom(id);
      return;
    }
    if((st.players||[]).length>=2)return gameMsg("এই Room ইতিমধ্যে পূর্ণ");

    st.players=[...(st.players||[]),currentUser.uid];
    ensureGameMeta(st);
    st.playerColors[currentUser.uid]=(st.players[0]===currentUser.uid)?"black":"white";
    st.version=Date.now();

    await update(roomRef,{state:st});
    await watchRoom(id);
  }catch(e){
    console.error(e);
    gameMsg(dbError(e));
  }
}

async function signup(){
 const name=$("signupName").value.trim();
 const mobile=cleanMobile($("signupMobile").value);
 const pin=$("signupPin").value.trim();
 const pin2=$("signupPin2").value.trim();
 const refMobile=cleanMobile($("refMobile").value);
 if(name.length<2)return setMsg("সঠিক নাম দিন");
 if(mobile.length<10||mobile.length>15)return setMsg("সঠিক মোবাইল নম্বর দিন");
 if(!/^\d{6}$/.test(pin))return setMsg("PIN অবশ্যই ৬ সংখ্যার হতে হবে");
 if(pin!==pin2)return setMsg("দুইটি PIN মিলছে না");
 if(refMobile===mobile)return setMsg("নিজের নম্বরকে রেফার করা যাবে না");
 try{
   const cred=await createUserWithEmailAndPassword(auth,emailForMobile(mobile),pin);
   const uid=cred.user.uid;
   if(refMobile){
     const rs=await get(ref(db,"usersByMobile/"+refMobile));
     if(!rs.exists()){
       await deleteUser(cred.user);
       return setMsg("রেফার মোবাইল নম্বর পাওয়া যায়নি");
     }
   }
   await set(ref(db,"users/"+uid),{
     uid,name,mobile,referrerMobile:refMobile||null,
     createdAt:Date.now(),gameName:name
   });
   await set(ref(db,"usersByMobile/"+mobile),{uid,name,mobile});
   if(refMobile){
     const rr=await get(ref(db,"referrals/"+refMobile+"/"+uid));
     if(!rr.exists())await set(ref(db,"referrals/"+refMobile+"/"+uid),{
       uid,name,mobile,createdAt:Date.now()
     });
   }
   setMsg("সাইনআপ সফল");
 }catch(e){setMsg(friendlyError(e))}
}

async function login(){
 const mobile=cleanMobile($("loginMobile").value);
 const pin=$("loginPin").value.trim();
 if(mobile.length<10)return setMsg("সঠিক মোবাইল নম্বর দিন");
 if(!/^\d{6}$/.test(pin))return setMsg("৬ সংখ্যার PIN দিন");
 try{await signInWithEmailAndPassword(auth,emailForMobile(mobile),pin)}
 catch(e){setMsg(friendlyError(e))}
}
function friendlyError(e){
 const c=e?.code||"";
 if(c.includes("email-already-in-use"))return "এই মোবাইল নম্বর দিয়ে আগে থেকেই অ্যাকাউন্ট আছে।";
 if(c.includes("invalid-credential")||c.includes("wrong-password"))return "মোবাইল নম্বর বা PIN ভুল।";
 if(c.includes("operation-not-allowed"))return "Firebase Authentication-এ Email/Password চালু করুন।";
 if(c.includes("weak-password"))return "PIN অন্তত ৬ সংখ্যার হতে হবে।";
 return "সমস্যা হয়েছে: "+(e?.message||"Unknown error");
}

$("loginTab").onclick=()=>{$("loginBox").style.display="block";$("signupBox").style.display="none";setMsg("")};
$("signupTab").onclick=()=>{$("loginBox").style.display="none";$("signupBox").style.display="block";setMsg("")};
$("signupBtn").onclick=signup;
$("loginBtn").onclick=login;
$("logoutBtn").onclick=()=>signOut(auth);
$("createBtn").onclick=createRoom;
$("joinBtn").onclick=joinRoom;
$("resetBtn").onclick=async()=>{
 if(!state||!roomId||state.turn!==currentUser.uid)return;
 state=initialState(currentUser.uid);
 await saveRoomState();
};

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(!user){
   authBox.style.display="block";gameBox.style.display="none";return;
 }
 authBox.style.display="none";gameBox.style.display="block";
 const snap=await get(ref(db,"users/"+user.uid));
 currentProfile=snap.val()||{};
 $("hello").textContent="👤 "+(currentProfile.name||"Player");
 $("mobileShow").textContent=currentProfile.mobile?"মোবাইল: "+currentProfile.mobile:"";
 draw();
});
